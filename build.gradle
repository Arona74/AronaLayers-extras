// Root project — aggregator only.
// All build logic lives in the version subprojects (v1_20_1/, v1_21_1/).

// Jars build to each subproject's own build/libs, as usual.
//
// Opt-in escape hatch: this repository lives inside OneDrive, which — along with
// the VS Code Java language server — can file-lock build/. That shows up as
// "Unable to delete directory" or "Failed to clean up stale outputs", and in the
// worst case as BUILD SUCCESSFUL while the previous jar is left in place, so a
// test silently runs stale code. If that happens, build with
// -PbuildDirRoot=<path> (or set ARONALAYERS_BUILD_DIR) to move the outputs off
// OneDrive, or just check the jar's timestamp before trusting a test.
def buildDirRoot = providers.gradleProperty('buildDirRoot')
        .orElse(providers.environmentVariable('ARONALAYERS_BUILD_DIR'))
        .getOrNull()

if (buildDirRoot) {
    allprojects {
        layout.buildDirectory = file("${buildDirRoot}/${project.name}")
    }
}

subprojects {
    repositories {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
    }
}
